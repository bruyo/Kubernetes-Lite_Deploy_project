apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-lite-service
  labels:
    app: k8s-lite-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-lite-service
  template:
    metadata:
      labels:
        app: k8s-lite-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
    imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: k8s-lite-service
          image: ghcr.io/bruyo/k8s-lite-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
